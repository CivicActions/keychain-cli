default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  # Commit messages must be Conventional Commits: Release Please parses them to decide
  # the next version and to generate CHANGELOG.md. See CONTRIBUTING.md.
  # Unlike the local hooks below, this is a pinned upstream repo so the rev is exact.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
            revert,
          ]

  - repo: local
    hooks:
      # Code Formatter: Ruff format (fast, Black-compatible)
      - id: ruff-format
        name: Ruff Formatter
        entry: bash -c 'if command -v ruff >/dev/null 2>&1; then ruff format --force-exclude "$@"; else env -u UV_ENV_FILE uvx ruff format --force-exclude "$@"; fi' --
        language: system
        types_or: [python, pyi]

      # Python Linter: Ruff check (fast linter with auto-fix)
      - id: ruff-check
        name: Ruff Linter
        entry: bash -c 'if command -v ruff >/dev/null 2>&1; then ruff check --fix --force-exclude "$@"; else env -u UV_ENV_FILE uvx ruff check --fix --force-exclude "$@"; fi' --
        language: system
        types_or: [python, pyi]

      # Python Linter: Pylint. Runs the project's pinned pylint inside the uv environment so
      # test imports (pytest) resolve, and scores src+tests once, matching CI.
      - id: pylint
        name: Pylint Linter
        entry: env -u UV_ENV_FILE uv run pylint src tests
        language: system
        types: [python]
        pass_filenames: false

      # SAST Scanner: Argus (runs on push)
      - id: argus-sast
        name: Argus SAST Scanners
        entry: bash -c 'if command -v argus >/dev/null 2>&1; then argus scan --allow-local-versions; else env -u UV_ENV_FILE uvx --from argus-security argus scan --allow-local-versions; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
