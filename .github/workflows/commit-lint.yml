name: Commit Lint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Pull requests are merge-committed, not squashed, so this title is not the only
      # message Release Please reads -- every commit on the branch lands on main and is
      # parsed too. This gate still matters because the title heads the merge commit and
      # is the one message checked for subject casing, which the local commit-msg hook
      # cannot check.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" is invalid: it must start with a
            lowercase character and must not end with a period.
