name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv dropped its moving major tags in v8, so this pins an exact version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Lockfile is current
        run: uv lock --check

      - name: Install
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Pylint
        run: uv run pylint src tests

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Integration tests (temporary keychain, never the login keychain)
        run: uv run pytest -m integration

      - name: Dependency vulnerability audit
        run: uvx pip-audit --strict
