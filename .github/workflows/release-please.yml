name: Release

on:
  push:
    branches: [main]
  # Manual entry point for publishing an existing tag. Two cases it covers:
  # bootstrapping the first PyPI release from a tag Release Please did not create,
  # and retrying a publish that failed after the tag and GitHub Release already
  # existed (Release Please will not re-run for an already-released version).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PAT, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not trigger other
      # workflows, so ci.yml would never run against the release PR.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and publish to PyPI
    needs: release-please
    # always() is required: on workflow_dispatch the release-please job is skipped,
    # and a skipped dependency would otherwise skip this job too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    # Pure-Python wheel with no compiled extensions, so the artifact is identical to one
    # built on macOS. Tests still run on macos-latest in ci.yml.
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keychain-cli
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # attach artifacts to the GitHub Release
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # setup-uv dropped its moving major tags in v8, so this pins an exact version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Attach distribution to GitHub Release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
