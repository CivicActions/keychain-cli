name: Release

on:
  push:
    branches: [main]
  # Manual entry point for building an existing tag. Two cases it covers:
  # bootstrapping a release from a tag Release Please did not create, and
  # retrying a build that failed after the tag and GitHub Release already
  # existed (Release Please will not re-run for an already-released version).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate release App token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify release PR commit signatures
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].number' <<< "$RELEASE_PRS" | while read -r pr; do
            sha="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.head.sha')"
            verified="$(gh api "repos/$GH_REPO/commits/$sha" --jq '.commit.verification.verified')"
            if [[ "$verified" != true ]]; then
              echo "::error::Release PR #$pr commit is not verified by GitHub"
              exit 1
            fi
          done

  publish:
    name: Build and publish to PyPI
    needs: release-please
    # always() is required: on workflow_dispatch the release-please job is skipped,
    # and a skipped dependency would otherwise skip this job too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    # Pure-Python wheel with no compiled extensions, so the artifact is identical to one
    # built on macOS. Tests still run on macos-latest in ci.yml.
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keychain-cli
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # attach artifacts to the GitHub Release
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # setup-uv dropped its moving major tags in v8, so this pins an exact version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true

      - name: Attach distribution to GitHub Release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
