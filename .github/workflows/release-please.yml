name: Release

on:
  push:
    branches: [main]
  # Manual entry point for building an existing tag. Two cases it covers:
  # bootstrapping a release from a tag Release Please did not create, and
  # retrying a build that failed after the tag and GitHub Release already
  # existed (Release Please will not re-run for an already-released version).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PAT, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not trigger other
      # workflows, so ci.yml would never run against the release PR.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # PyPI publishing is ON HOLD pending the PyPI account/organization setup.
    # Everything below still runs: the distribution is built, its metadata is
    # validated, and the artifacts are attached to the GitHub Release. Only the
    # upload to PyPI is disabled. To re-enable, uncomment the three blocks marked
    # "PYPI ON HOLD" below. Nothing else needs to change.
    name: Build and attach to GitHub Release
    needs: release-please
    # always() is required: on workflow_dispatch the release-please job is skipped,
    # and a skipped dependency would otherwise skip this job too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    # Pure-Python wheel with no compiled extensions, so the artifact is identical to one
    # built on macOS. Tests still run on macos-latest in ci.yml.
    runs-on: ubuntu-latest
    # PYPI ON HOLD (1/3): needs the `pypi` GitHub environment to exist.
    # environment:
    #   name: pypi
    #   url: https://pypi.org/p/keychain-cli
    permissions:
      # PYPI ON HOLD (2/3): OIDC token for Trusted Publishing. Kept off until
      # publishing resumes so the job runs with no more privilege than it needs.
      # id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # attach artifacts to the GitHub Release
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # setup-uv dropped its moving major tags in v8, so this pins an exact version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      # PYPI ON HOLD (3/3): the actual upload.
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Attach distribution to GitHub Release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
