[build-system]
requires = ["uv_build>=0.1,<0.13"]
build-backend = "uv_build"

[project]
name = "keychain-cli"
version = "0.2.0"
description = "Security-focused CLI for storing and retrieving secrets in macOS Keychain"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "CivicActions" }]
keywords = [
    "macos",
    "keychain",
    "secrets",
    "secret-management",
    "environment-variables",
    "dotenv",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CivicActions/keychain-cli"
Repository = "https://github.com/CivicActions/keychain-cli"
Changelog = "https://github.com/CivicActions/keychain-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/CivicActions/keychain-cli/issues"
Security = "https://github.com/CivicActions/keychain-cli/blob/main/SECURITY.md"

[project.scripts]
keychain-cli = "keychain_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pylint>=3.3.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests against macOS Keychain",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "specs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "SIM102"]

[tool.pylint.main]
fail-under = 8.0
ignore-paths = [
    "^specs/.*",
]

[tool.pylint.messages_control]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
