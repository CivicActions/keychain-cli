[build-system]
requires = ["uv_build>=0.1"]
build-backend = "uv_build"

[project]
name = "keychain-cli"
version = "0.1.0"
description = "Security-focused CLI for storing and retrieving secrets in macOS Keychain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keychain-cli = "keychain_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pylint>=3.3.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests against macOS Keychain",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "specs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = []

[tool.pylint.main]
fail-under = 8.0
ignore-paths = [
    "^specs/.*",
]

[tool.pylint.messages_control]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
